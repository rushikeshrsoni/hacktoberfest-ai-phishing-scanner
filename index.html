<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Detective AI | Threat Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        body { 
            margin: 0; background-color: #050505; color: #00ffea; 
            font-family: 'Share Tech Mono', monospace; overflow: hidden;
            background-image: linear-gradient(rgba(0, 255, 234, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 234, 0.05) 1px, transparent 1px);
            background-size: 30px 30px; background-position: center center;
        }
        canvas { position: absolute; top: 0; left: 0; z-index: -1; }
        .cyber-glass { background: rgba(5, 10, 15, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(0, 255, 234, 0.3); box-shadow: 0 0 40px rgba(0, 255, 234, 0.1), inset 0 0 20px rgba(0, 255, 234, 0.05); border-radius: 4px; transform-style: preserve-3d; }
        .glitch { position: relative; color: #00ffea; text-shadow: 0 0 10px rgba(0,255,234,0.8); }
        .glitch::before, .glitch::after { content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #050505; }
        .glitch::before { left: 2px; text-shadow: -1px 0 #ff003c; clip: rect(44px, 450px, 56px, 0); animation: glitch-anim 5s infinite linear alternate-reverse; }
        .glitch::after { left: -2px; text-shadow: -1px 0 #00ffea; clip: rect(44px, 450px, 56px, 0); animation: glitch-anim2 5s infinite linear alternate-reverse; }
        @keyframes glitch-anim { 0% { clip: rect(10px, 9999px, 81px, 0); } 20% { clip: rect(65px, 9999px, 34px, 0); } 40% { clip: rect(19px, 9999px, 20px, 0); } 60% { clip: rect(40px, 9999px, 96px, 0); } 80% { clip: rect(51px, 9999px, 31px, 0); } 100% { clip: rect(72px, 9999px, 60px, 0); } }
        .cyber-input { background: rgba(0, 0, 0, 0.6); border: 1px solid #00ffea; color: #00ffea; box-shadow: inset 0 0 10px rgba(0,255,234,0.2); transition: all 0.3s; }
        .cyber-input:focus { outline: none; box-shadow: inset 0 0 20px rgba(0,255,234,0.5), 0 0 15px rgba(0,255,234,0.3); }
        .cyber-btn { background: transparent; border: 1px solid #00ffea; color: #00ffea; text-transform: uppercase; position: relative; overflow: hidden; transition: 0.2s; }
        .cyber-btn:hover { background: #00ffea; color: #000; box-shadow: 0 0 25px #00ffea; cursor: crosshair; }
        .radar { width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(0,255,234,0.3); position: relative; margin: 0 auto; overflow: hidden; background: rgba(0,255,234,0.05); box-shadow: 0 0 30px rgba(0,255,234,0.2); }
        .radar::before { content: ''; position: absolute; top: 50%; left: 50%; width: 50%; height: 50%; background: linear-gradient(45deg, rgba(0,255,234,0) 50%, rgba(0,255,234,1) 100%); transform-origin: 0% 0%; animation: scan 2s linear infinite; }
        .radar-h { position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: rgba(0,255,234,0.2); }
        @keyframes scan { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .circular-chart { display: block; margin: 0 auto; max-width: 100px; max-height: 100px; }
        .circle-bg { fill: none; stroke: rgba(0, 255, 234, 0.1); stroke-width: 3.8; }
        .circle { fill: none; stroke-width: 3.8; stroke-linecap: round; }
        .percentage { font-family: 'Share Tech Mono'; font-size: 0.5em; text-anchor: middle; font-weight: bold; }
        .hidden { display: none; }
        .text-alert { color: #ff003c; text-shadow: 0 0 15px rgba(255,0,60,0.8); }
        .text-safe { color: #00ffea; text-shadow: 0 0 15px rgba(0,255,234,0.8); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <canvas id="matrix"></canvas>

    <div class="cyber-glass p-10 max-w-4xl w-full mx-4 relative z-10" data-tilt data-tilt-max="3" data-tilt-speed="400" data-tilt-glare data-tilt-max-glare="0.2">
        <div class="text-center mb-10 transform translate-z-10">
            <h1 class="text-5xl font-bold mb-2 glitch uppercase tracking-wider" data-text="A.I. THREAT INTEL">A.I. THREAT INTEL</h1>
            <p class="text-[#00ffea] opacity-70 text-sm tracking-[0.3em] uppercase">Tactical Phishing & Protocol Analyzer</p>
        </div>
        
        <div class="flex gap-4 mb-6 relative z-20" style="transform: translateZ(30px);">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-[#00ffea] opacity-50"><span>></span></div>
            <input type="text" id="urlInput" placeholder="TARGET_URL : //" class="cyber-input w-full rounded-sm pl-8 pr-4 py-4 tracking-wider">
            <button onclick="initiateHackSequence()" class="cyber-btn px-10 py-4 rounded-sm font-bold tracking-[0.2em]">ENGAGE_</button>
        </div>
        
        <div id="loadingState" class="hidden py-12 text-center" style="transform: translateZ(40px);">
            <div class="radar mb-6"><div class="radar-h"></div></div>
            <p class="animate-pulse tracking-[0.4em] text-lg font-bold">DECRYPTING PACKETS...</p>
            <p class="text-xs opacity-50 mt-2 tracking-widest font-mono" id="loadingLogs">Establish connection on port 443...</p>
        </div>
        
        <div id="resultsState" class="hidden mt-8 border-t border-[#00ffea]/20 pt-8" style="transform: translateZ(50px);">
            <div class="grid grid-cols-3 gap-6 mb-8">
                <!-- Score Card -->
                <div class="border border-[#00ffea]/30 bg-[#050505]/80 p-4 rounded text-center relative overflow-hidden">
                    <h3 class="text-xs uppercase tracking-widest opacity-60 mb-2">Scam Probability</h3>
                    <svg viewBox="0 0 36 36" class="circular-chart">
                        <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        <path class="circle" id="scoreCircle" stroke="#00ffea" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        <text x="18" y="20.35" class="percentage" id="scoreText">0%</text>
                    </svg>
                </div>

                <!-- Threat Level Card -->
                <div class="border border-[#00ffea]/30 bg-[#050505]/80 p-4 rounded flex flex-col justify-center items-center text-center">
                    <h3 class="text-xs uppercase tracking-widest opacity-60 mb-2">Threat Status</h3>
                    <h2 id="threatStatus" class="text-2xl font-bold glitch" data-text="ANALYZING">ANALYZING</h2>
                </div>

                <!-- Indicators Card -->
                <div class="border border-[#00ffea]/30 bg-[#050505]/80 p-4 rounded flex flex-col justify-center gap-2 text-xs">
                    <div class="flex justify-between items-center"><span class="opacity-70">SSL_CERT</span> <span id="sslStatus">...</span></div>
                    <div class="flex justify-between items-center"><span class="opacity-70">IP_HOST</span> <span id="ipStatus">...</span></div>
                    <div class="flex justify-between items-center"><span class="opacity-70">BAIT_WORDS</span> <span id="baitStatus">...</span></div>
                </div>
            </div>
            
            <div class="bg-[#020202] border border-[#00ffea]/30 p-5 font-mono shadow-[inset_0_0_20px_rgba(0,255,234,0.05)]">
                <div class="flex items-center gap-2 mb-3 border-b border-[#00ffea]/20 pb-2">
                    <span class="w-3 h-3 bg-[#00ffea] animate-pulse shadow-[0_0_10px_#00ffea]"></span>
                    <span class="text-xs tracking-widest">SYSTEM.AI.OVERRIDE //</span>
                </div>
                <p class="text-sm leading-relaxed text-gray-300" id="aiReport">></p>
            </div>
        </div>
    </div>

    <script>
        // Matrix Rain
        const canvas = document.getElementById('matrix'); const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$+-*/=%\"'#&_(),.;:?!\\|{}<>[]^~";
        const fontSize = 14; const columns = canvas.width / fontSize;
        const drops = []; for (let x = 0; x < columns; x++) drops[x] = 1;
        setInterval(() => {
            ctx.fillStyle = "rgba(5, 5, 5, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00ffea"; ctx.font = fontSize + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }, 50);

        // Sound System
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(freq, type, duration, vol=0.1) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        // Text Scramble
        function scrambleText(element, finalString, speed = 20) {
            const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*"; let iteration = 0;
            clearInterval(element.dataset.interval);
            element.dataset.interval = setInterval(() => {
                element.innerText = finalString.split("").map((letter, index) => {
                    if(index < iteration) return finalString[index];
                    return letters[Math.floor(Math.random() * 26)];
                }).join("");
                if (iteration >= finalString.length) clearInterval(element.dataset.interval);
                iteration += 1 / 2;
            }, speed);
        }

        // Main Logic
        async function initiateHackSequence() {
            const url = document.getElementById('urlInput').value;
            if(!url) { playBeep(200, 'sawtooth', 0.5, 0.2); return alert("ERROR: TARGET_URL REQUIRED"); }
            
            playBeep(800, 'square', 0.1); setTimeout(() => playBeep(1200, 'square', 0.2), 150);
            document.getElementById('resultsState').classList.add('hidden');
            document.getElementById('loadingState').classList.remove('hidden');
            
            const logs = ["Bypassing firewalls...", "Extracting SSL cert data...", "Analyzing domain age...", "Checking threat intelligence databases..."];
            let logIndex = 0;
            const logInterval = setInterval(() => {
                document.getElementById('loadingLogs').innerText = logs[logIndex % logs.length];
                playBeep(600 + (Math.random()*400), 'sine', 0.05); logIndex++;
            }, 600);

            try {
                const response = await fetch('http://127.0.0.1:5000/api/scan', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: url })
                });
                const data = await response.json();
                clearInterval(logInterval);
                
                if(data.error) { alert("AI Error: " + data.error); document.getElementById('loadingState').classList.add('hidden'); return; }

                playBeep(400, 'sawtooth', 1, 0.2); 
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('resultsState').classList.remove('hidden');
                
                // DYNAMIC UI UPDATES BASED ON PYTHON BACKEND
                const scan = data.scan_data;
                const score = data.score_data;
                const targetVal = parseInt(score.scam_probability_score.replace('%', ''));
                
                // Update Threat Level Text & Color
                const threatEl = document.getElementById('threatStatus');
                let riskWord = score.risk_level.split('-')[0].trim(); // SAFE, SUSPICIOUS, or CRITICAL RISK
                threatEl.innerText = riskWord;
                threatEl.setAttribute('data-text', riskWord);
                
                const scoreCircle = document.getElementById('scoreCircle');
                const scoreText = document.getElementById('scoreText');
                
                if(targetVal < 30) {
                    threatEl.className = "text-2xl font-bold text-safe glitch";
                    scoreCircle.setAttribute('stroke', '#00ffea');
                    scoreText.style.fill = '#00ffea';
                } else {
                    threatEl.className = "text-2xl font-bold text-alert glitch";
                    scoreCircle.setAttribute('stroke', '#ff003c');
                    scoreText.style.fill = '#ff003c';
                }

                // Update Progress Circle
                scoreCircle.setAttribute('stroke-dasharray', `${targetVal}, 100`);
                let currentVal = 0;
                const gaugeInterval = setInterval(() => {
                    if(currentVal >= targetVal) { clearInterval(gaugeInterval); scoreText.textContent = targetVal + "%"; } 
                    else { scoreText.textContent = Math.floor(currentVal) + "%"; currentVal += 2; }
                }, 40);

                // Update Mini Indicators
                document.getElementById('sslStatus').innerHTML = scan.is_https ? '<span class="text-[#00ffea]">SECURE [✓]</span>' : '<span class="text-[#ff003c]">FAILED [X]</span>';
                document.getElementById('ipStatus').innerHTML = scan.is_ip_host ? '<span class="text-[#ff003c]">TRUE [X]</span>' : '<span class="text-[#00ffea]">FALSE [✓]</span>';
                document.getElementById('baitStatus').innerHTML = scan.has_suspicious_keywords ? '<span class="text-[#ff003c]">DETECTED [!]</span>' : '<span class="text-[#00ffea]">CLEAN [✓]</span>';

                // Print Gemma AI's Report
                const reportElement = document.getElementById('aiReport');
                scrambleText(reportElement, "> " + data.report, 20);
                
                let typeAudio = setInterval(() => playBeep(800, 'square', 0.02, 0.05), 50);
                setTimeout(() => clearInterval(typeAudio), (data.report.length * 10) * 2);

            } catch (error) {
                clearInterval(logInterval);
                alert("CONNECTION FAILED! Check terminal server.");
                document.getElementById('loadingState').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
